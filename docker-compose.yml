services:
  google-maps-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-u", "/app/api-server.py"]
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - MAX_DAILY=100
      - DAYS_TO_KEEP=90
      - OUTPUT_DIR=/app/output
      - HISTORY_FILE=/app/data/history.json
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    shm_size: 2gb
